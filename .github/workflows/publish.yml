name: Publish images

# Builds the importer and backup images and publishes them to GitHub Container
# Registry when a GitHub Release is published, or when release.yml starts it on
# a new tag. It only runs on a vX.Y.Z tag on main:
#   ghcr.io/jmcmeen/observa-importer:<version>
#   ghcr.io/jmcmeen/observa-backup:<version>
# Each gets the full version (0.2.7), its minor line (0.2) and, for the newest
# release, latest. Both are built for amd64 and arm64.
#
# Two jobs, so a release is never half published:
#   build    builds each image and pushes it by digest only, with no tag, and hands
#            the digest to the release job.
#   release  once both builds succeeded, tags those exact images with the version,
#            then moves the minor-line and latest tags if this is still the
#            newest release. Those are decided here, right before they move,
#            so a slow run for an older release can't push them backwards.
# A version tag that already exists is never overwritten, so re-running a
# release (like re-running a PyPI publish) only completes what is missing and
# re-checks the moving tags. Nothing temporary is left in the registry.
#
# No secrets: it pushes with the workflow's GITHUB_TOKEN. A package GitHub
# hasn't seen before starts out private. After the first publish, open each
# package (github.com/jmcmeen?tab=packages), Package settings, and change its
# visibility to public, or nobody can pull it without logging in.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        image: [importer, backup] # keep in step with the loops in the release job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags

      - name: Require a release tag on main
        run: |
          # Run by hand on a branch, this would publish code that never went
          # through main and its CI.
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Publish only runs on a vX.Y.Z tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            exit 1
          fi
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; only release tags from main are published."
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this release is already published
        id: names
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version=${GITHUB_REF_NAME#v}
          name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/observa-$IMAGE
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # A published version tag is never overwritten: a retry would build
          # from newer base images and packages and change what that version is.
          if docker buildx imagetools inspect "$name:$version" > /dev/null 2>&1; then
            echo "$name:$version is already published; not rebuilding it."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        id: build
        if: steps.names.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.names.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=observa-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record the image digest
        if: steps.names.outputs.published != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/$IMAGE"

      - name: Hand the digest to the release job
        if: steps.names.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Release tags
    needs: build # both images built, or nothing is released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # retag in ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags

      - name: Require a release tag on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Publish only runs on a vX.Y.Z tag, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            exit 1
          fi
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main; only release tags from main are published."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the image digests from the build jobs
        # Nothing to download when every image was already published.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Give both images their release tags
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          version=${GITHUB_REF_NAME#v}
          minor=${version%.*}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          images="importer backup" # keep in step with the build matrix
          exists() { docker buildx imagetools inspect "$1" > /dev/null 2>&1; }
          digest() { cat "digests/$1" 2> /dev/null; }

          # Everything must be in place before anything is tagged, so a release
          # is never left with one image.
          for image in $images; do
            name=ghcr.io/$owner/observa-$image
            if ! exists "$name:$version" && [ -z "$(digest "$image")" ]; then
              echo "::error::$name has neither $version nor a build from this run; not releasing."
              exit 1
            fi
          done
          for image in $images; do
            name=ghcr.io/$owner/observa-$image
            if ! exists "$name:$version"; then
              docker buildx imagetools create --tag "$name:$version" "$name@$(digest "$image")"
            fi
          done

          # Moving tags follow the newest release on main. Decided now, from
          # fresh tags, not when the run started: a slower run for an older
          # release must not move them backwards.
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git fetch -q --tags --force origin
          newest() { git tag --merged origin/main --list "$1" | grep -E "$semver" | sort -V | tail -1; }
          for image in $images; do
            name=ghcr.io/$owner/observa-$image
            args=()
            [ "$(newest "v$minor.*")" = "$GITHUB_REF_NAME" ] && args+=(--tag "$name:$minor")
            [ "$(newest 'v*')" = "$GITHUB_REF_NAME" ] && args+=(--tag "$name:latest")
            if [ ${#args[@]} -gt 0 ]; then
              docker buildx imagetools create "${args[@]}" "$name:$version"
            else
              echo "$GITHUB_REF_NAME isn't the newest release on main; leaving the moving tags of $name alone."
            fi
          done
