name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint importer Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: importer/Dockerfile
      - name: Lint backup Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backup/Dockerfile

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-test
          API_USER_PASSWORD: ci-test
          GF_SECURITY_ADMIN_PASSWORD: ci-test
      - name: Validate the build overlay
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-test
          API_USER_PASSWORD: ci-test
          GF_SECURITY_ADMIN_PASSWORD: ci-test

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint -d relaxed docker-compose.yml docker-compose.build.yml grafana/provisioning/

  smoke-test:
    name: Smoke test (seeded stack + API)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test
      API_USER_PASSWORD: ci-test
      GF_SECURITY_ADMIN_PASSWORD: ci-test
      # Feb 31 never comes: the importer must not download iNaturalist in CI.
      IMPORT_CRON: "0 3 31 2 *"
      # Test this commit's importer and backup, not the last release's.
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 300 postgres importer postgrest nginx

      - name: Seed test data and run API smoke tests
        run: ./scripts/test-local.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
